  <script>
    // --------------------------------------------------------------
    // 300 MCQs from the file
    // --------------------------------------------------------------
    const rawMCQs = [
      { q: "A software startup is evaluating two projects. Project Alpha requires an initial investment of $50,000 and generates $15,000 annually, while Project Beta requires $80,000 and generates $30,000 annually. Which financial metric helps the manager determine how quickly the initial investment is recovered?", opts: ["Return on Investment (ROI)", "Payback Period", "Net Present Value (NPV)", "Internal Rate of Return (IRR)"], ans: 1 },
      { q: "During a project feasibility meeting, the finance lead points out that $10,000 earned three years from now is worth less than $10,000 today due to inflation and opportunity cost. Which financial analysis technique accounts for this time value of money?", opts: ["Payback Period", "Break-Even Analysis", "Net Present Value (NPV)", "Cost-Benefit Ratio"], ans: 2 },
      { q: "A project manager calculates that a new ERP system will cost $120,000 to build and maintain over 3 years, while the expected financial savings and revenue gains over the same period total $180,000. What is the Return on Investment (ROI)?", opts: ["33.3%", "50%", "66.7%", "150%"], ans: 1 },
      { q: "A company has already spent $40,000 on a legacy module that is failing all performance benchmarks. The team lead argues they must continue funding it so the $40,000 is not wasted. In financial analysis, what is this $40,000 classified as?", opts: ["Variable Cost", "Tangible Benefit", "Sunk Cost", "Opportunity Cost"], ans: 2 },
      { q: "Before selecting a financial appraisal method, a CFO states that any approved software project must yield a return higher than the company's 12% cost of capital. Which metric directly compares against this hurdle rate?", opts: ["Internal Rate of Return (IRR)", "Payback Period", "Intangible Benefit Score", "Total Cost of Ownership (TCO)"], ans: 0 },
      { q: "A hospital software vendor lists \"improved patient trust\" and \"higher staff morale\" in their financial proposal. How should the hospital's financial analyst categorize these items?", opts: ["Direct Operational Costs", "Tangible Benefits", "Intangible Benefits", "Capital Expenditures"], ans: 2 },
      { q: "A SaaS product has fixed development costs of $60,000. Each subscription sells for $50, and the cloud hosting variable cost per user is $20. How many subscriptions must be sold to reach the break-even point?", opts: ["1,200", "2,000", "3,000", "600"], ans: 1 },
      { q: "When estimating the 5-year financial impact of purchasing an off-the-shelf CRM, an analyst includes license fees, hardware upgrades, staff training, and annual support. What financial concept is being applied?", opts: ["Payback Analysis", "Total Cost of Ownership (TCO)", "Sunk Cost Valuation", "Earned Value Management"], ans: 1 },
      { q: "A client asks a software house to build a \"smart inventory system\" because their warehouse is \"too slow.\" Before proposing any technology stack, the lead analyst interviews warehouse workers and maps current stock bottlenecks. Which phase is being executed?", opts: ["Software Construction", "Problem Understanding", "System Deployment", "Unit Testing"], ans: 1 },
      { q: "During problem understanding, a business analyst discovers that the client's requested mobile app will not solve their core issue, which is actually corrupted data in their central database. What is the analyst's primary responsibility here?", opts: ["Build the mobile app anyway as requested", "Separate symptoms from the root cause of the problem", "Skip requirements and start database migration", "Increase the project budget immediately"], ans: 1 },
      { q: "A software team is building a ride-sharing platform. To ensure everyone agrees on what the system will and will not do, the team defines boundaries such as \"supports cash and card payments, excludes cryptocurrency.\" What aspect of problem understanding is this?", opts: ["Defining System Scope", "Architectural Design", "Risk Mitigation", "Code Refactoring"], ans: 0 },
      { q: "An analyst conducts observation sessions where she silently watches bank tellers process transactions to understand unspoken workflow habits. Which problem understanding technique is she using?", opts: ["Joint Application Development (JAD)", "Ethnography / Observation", "Prototyping", "Survey Distribution"], ans: 1 },
      { q: "Stakeholders from marketing, finance, and IT give conflicting descriptions of how customer refunds should work. To resolve these conflicts and understand the problem domain collectively, the analyst organizes a structured workshop. What is this called?", opts: ["Code Review", "Joint Application Development (JAD) Session", "Regression Testing", "Sprint Retrospective"], ans: 1 },
      { q: "While analyzing a retail business problem, an engineer creates a diagram showing external entities (Customers, Suppliers) interacting with the system as a single black box. What tool is being used to understand the problem boundaries?", opts: ["Context Diagram", "Class Diagram", "Gantt Chart", "Sequence Diagram"], ans: 0 },
      { q: "A developer jumps straight into coding a payment gateway after a 5-minute phone call with a client, resulting in a system that violates regional banking laws. Which foundational step was neglected?", opts: ["Configuration Management", "Thorough Problem Understanding", "Load Testing", "Code Optimization"], ans: 1 },
      { q: "A project manager is reviewing a Gantt chart and notices that \"Database Schema Design\" has an arrow pointing directly to the start of \"Backend API Development.\" What type of task dependency does this represent?", opts: ["Start-to-Start (SS)", "Finish-to-Finish (FF)", "Finish-to-Start (FS)", "Start-to-Finish (SF)"], ans: 2 },
      { q: "On a project's Gantt chart, \"Client Sign-Off on UI Mockups\" is represented as a diamond shape with a duration of zero days. What does this symbol represent?", opts: ["A critical bottleneck", "A project milestone", "A slack period", "A resource conflict"], ans: 1 },
      { q: "A developer falls sick, delaying a UI styling task by 3 days. Looking at the Gantt chart, the project manager sees that this task has 5 days of float and does not delay the final delivery date. What can be concluded about this task?", opts: ["It is on the Critical Path", "It is a non-critical task with positive slack", "It is a milestone", "It has a Finish-to-Finish dependency"], ans: 1 },
      { q: "A team lead wants to visualize which tasks can be executed in parallel by different developers and track the real-time percentage completion of each module against baseline dates. Which tool is best suited for this?", opts: ["Use Case Diagram", "Gantt Chart", "Entity-Relationship Diagram", "State Transition Diagram"], ans: 1 },
      { q: "During a weekly status review, the project manager checks the vertical \"Today\" line on the Gantt chart and sees that the \"Authentication Module\" bar is only 40% shaded to the left of the line. What does this indicate?", opts: ["The task is ahead of schedule", "The task is behind schedule", "The task has zero dependencies", "The task has been cancelled"], ans: 1 },
      { q: "While updating a Gantt chart, a manager links \"Write User Manual\" and \"Software Coding\" so that both activities conclude on the exact same date before deployment. Which dependency type is used?", opts: ["Finish-to-Start (FS)", "Start-to-Start (SS)", "Finish-to-Finish (FF)", "Start-to-Finish (SF)"], ans: 2 },
      { q: "A junior manager tries to use a Gantt chart to see the exact lines of code written per developer and memory leaks in the application. Why is this problematic?", opts: ["Gantt charts only track financial ROI", "Gantt charts show schedules and timelines, not internal code metrics", "Gantt charts cannot display parallel tasks", "Gantt charts only work for Waterfall projects"], ans: 1 },
      { q: "A software team follows five core steps for every project: Communication, Planning, Modeling, Construction, and Deployment. In software engineering terminology, what are these five steps collectively known as?", opts: ["Umbrella Activities", "Generic Process Framework Activities", "Quality Assurance Metrics", "Risk Management Protocols"], ans: 1 },
      { q: "During the \"Modeling\" framework activity, a software architect creates ER diagrams and system architecture blueprints before any production code is written. Which two sub-actions make up this framework activity?", opts: ["Coding and Testing", "Analysis and Design", "Scheduling and Tracking", "Deployment and Support"], ans: 1 },
      { q: "A client requests a major change to the reporting module halfway through development. The team uses a version control system (Git) and formal change-control boards to manage the updated files without breaking existing builds. Which umbrella activity is this?", opts: ["Software Configuration Management (SCM)", "Software Project Tracking", "Formal Technical Reviews", "Reusability Management"], ans: 0 },
      { q: "Before releasing a banking module, senior engineers conduct a structured peer walkthrough of the source code to catch logic errors early. Which umbrella activity is being performed?", opts: ["Measurement", "Formal Technical Reviews (FTR)", "Risk Management", "Work Product Preparation"], ans: 1 },
      { q: "A project manager identifies that the third-party payment API might deprecate before launch, so she prepares a backup gateway integration plan. Which umbrella activity applies throughout the process to handle this?", opts: ["Software Quality Assurance", "Risk Management", "Configuration Management", "Deployment"], ans: 1 },
      { q: "Unlike framework activities that occur in a sequence or iteration, activities like Software Quality Assurance and Measurement run continuously from project start to finish. Why are they called \"Umbrella Activities\"?", opts: ["They protect the team from client interference", "They span across the entire software process to support all framework activities", "They are only used during rainy-day emergencies", "They replace the need for project planning"], ans: 1 },
      { q: "A software company tracks defect density, velocity, and lines of code across all projects to improve future cost and schedule estimates. Which umbrella activity is the company practicing?", opts: ["Measurement", "Reusability Management", "Communication", "Construction"], ans: 0 },
      { q: "A team builds an authentication library once and catalogs it with documentation so future mobile and web projects can integrate it without rewriting code. Which umbrella activity governs this?", opts: ["Risk Management", "Reusability Management", "Formal Technical Reviews", "Project Tracking"], ans: 1 },
      { q: "After delivering a completed e-commerce platform to the client, the engineering team collects user feedback and fixes post-release bugs. Which generic framework activity does this belong to?", opts: ["Planning", "Modeling", "Construction", "Deployment"], ans: 3 },
      { q: "A QA engineer audits whether the development team is following the organization's documented coding standards and testing procedures during sprint execution. Which umbrella activity is this?", opts: ["Software Quality Assurance (SQA)", "Software Configuration Management", "Problem Understanding", "Financial Analysis"], ans: 0 },
      { q: "A project manager compares actual weekly hours logged by developers against the baseline schedule created during the Planning phase. Which umbrella activity is being executed?", opts: ["Software Project Tracking and Control", "Reusability Management", "Work Product Preparation", "Modeling"], ans: 0 },
      { q: "During the \"Construction\" framework activity, a developer writes Java classes and immediately runs JUnit tests to verify each method works properly. Which two actions are combined in Construction?", opts: ["Analysis and Design", "Code Generation and Testing", "Estimation and Scheduling", "Delivery and Feedback"], ans: 1 },
      { q: "A project team creates user manuals, test plans, and database schemas alongside the source code. Which umbrella activity ensures these artifacts are properly formatted and produced?", opts: ["Work Product Preparation and Production", "Risk Management", "Measurement", "Communication"], ans: 0 },
      { q: "An IT director rejects a proposed internal automation tool because its NPV is -$15,000, even though its payback period is 4 years. What does a negative NPV signify?", opts: ["The project will break even immediately", "The project's costs outweigh its discounted financial benefits", "The project has zero sunk costs", "The project's IRR is higher than the discount rate"], ans: 1 },
      { q: "During a problem understanding session, a stakeholder says, \"The system must be super fast.\" The analyst pushes back and asks, \"What exact response time in seconds is acceptable during peak hours?\" What is the analyst eliminating?", opts: ["Ambiguity", "Technical Debt", "Sunk Cost", "Critical Path"], ans: 0 },
      { q: "A Gantt chart shows that Task A (4 days), Task B (6 days), and Task C (3 days) must happen sequentially with zero slack between them to finish the project in 13 days. What is the sequence A -> B -> C called?", opts: ["Umbrella Path", "Critical Path", "Parallel Track", "Baseline Buffer"], ans: 1 },
      { q: "A startup founders' team meets with a software consultant to discuss their initial vision, target users, and high-level business goals before any estimates are made. Which framework activity is taking place?", opts: ["Communication", "Modeling", "Construction", "Deployment"], ans: 0 },
      { q: "A software vendor offers a client two pricing models: $100,000 upfront license or $3,000/month SaaS subscription. Comparing the cumulative cash outflows over 4 years to decide which costs less overall is an example of:", opts: ["Gantt Scheduling", "Financial Cost-Benefit / Cash Flow Analysis", "Problem Decomposition", "Configuration Management"], ans: 1 },
      { q: "While mapping a university's course registration problem, an analyst discovers that administrative rules prevent students from enrolling if they have unpaid library fines. Identifying this rule falls under:", opts: ["Business Rules & Constraints Identification", "Code Refactoring", "Unit Testing", "Gantt Charting"], ans: 0 },
      { q: "A project manager notices on a Gantt chart that two different tasks assigned to the same senior backend developer overlap completely during Week 4. What issue has the Gantt chart revealed?", opts: ["Resource Overallocation", "Negative NPV", "Scope Creep", "Missing Milestone"], ans: 0 },
      { q: "In a software project, cost estimation, task breakdown, and resource allocation are performed before modeling begins. Which generic framework activity encompasses these tasks?", opts: ["Communication", "Planning", "Construction", "Deployment"], ans: 1 },
      { q: "A project has an initial cost of $25,000 and generates net cash inflows of $10,000 in Year 1, $10,000 in Year 2, and $10,000 in Year 3. What is the exact Payback Period?", opts: ["2.0 years", "2.5 years", "3.0 years", "1.5 years"], ans: 1 },
      { q: "A developer modifies a shared database connection file, accidentally overwriting a teammate's bug fix from the previous day. Which umbrella activity failed to prevent this conflict?", opts: ["Software Configuration Management (SCM)", "Formal Technical Reviews", "Financial Analysis", "Reusability Management"], ans: 0 },
      { q: "An analyst creates a fishbone (Ishikawa) diagram with a client to trace why online checkout abandonment is at 70%. Which phase of software engineering is this activity supporting?", opts: ["Problem Understanding", "System Deployment", "Acceptance Testing", "Configuration Auditing"], ans: 0 },
      { q: "On a Gantt chart, Task X can start 2 days after Task Y begins, without waiting for Task Y to finish completely. Which dependency relationship should the manager configure?", opts: ["Finish-to-Start (FS) with lag", "Start-to-Start (SS) with a 2-day lag", "Finish-to-Finish (FF)", "Start-to-Finish (SF)"], ans: 1 },
      { q: "A software team skips the Planning and Modeling activities and immediately starts writing code to impress a client with quick progress. Weeks later, the architecture collapses under load. Which core software engineering principle was violated?", opts: ["Generic framework activities provide essential discipline and structure", "Umbrella activities are optional for small teams", "Financial analysis guarantees technical quality", "Gantt charts replace system design"], ans: 0 },
      { q: "A company evaluates a new AI chatbot that costs $40,000 to implement and will save $16,000 per year in customer support salaries. Ignoring discount rates, how much net profit will the chatbot generate by the end of Year 4?", opts: ["$16,000", "$24,000", "$40,000", "$64,000"], ans: 1 },
      { q: "During a Formal Technical Review (FTR), the review leader ensures the meeting focuses on finding defects in the design document rather than criticizing the author personally. Why is this rule critical to the umbrella activity?", opts: ["It reduces financial NPV", "It encourages psychological safety and objective defect detection", "It eliminates the need for testing", "It speeds up Gantt chart creation"], ans: 1 },
      { q: "A government defense agency wants to build missile guidance software where every safety requirement is strictly defined upfront and must pass formal audits before moving to design. Which SDLC model is most suitable?", opts: ["Agile Model", "Prototyping Model", "Waterfall Model", "Incremental Model"], ans: 2 },
      { q: "A software team finishes the Design phase of a project and begins Coding. Three weeks later, the client asks to modify a core requirement, forcing the team to halt work and renegotiate the contract. Which SDLC model are they likely using?", opts: ["Waterfall Model", "Scrum", "Incremental Model", "Extreme Programming"], ans: 0 },
      { q: "In a medical device software project, regulatory bodies require that every specification document has a corresponding verification test plan mapped before coding starts. Which model enforces this symmetrical verification and validation structure?", opts: ["Prototyping Model", "V-Model", "Incremental Model", "Rapid Application Development"], ans: 1 },
      { q: "During the V-Model lifecycle, a QA engineer writes Acceptance Test cases right after the Requirements Analysis phase is completed. Which development phase directly corresponds to System Testing on the right side of the V?", opts: ["Coding", "Module Design", "System Design", "Unit Testing"], ans: 2 },

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

          return {
            ...item,
            opts: shuffledOpts,
            correctIdx: newCorrectIdx
          };
        });
      }

      return items;
    }

    function renderQuiz(questions, resetAnswers = true) {
      if (resetAnswers) {
        answeredState = {};
      }
      currentQuestions = questions;
      mcqList.innerHTML = '';

      questions.forEach((q, idx) => {
        const qNum = idx + 1;
        const card = document.createElement('div');
        card.className = 'mcq-card';
        card.dataset.qIndex = idx;

        const qDiv = document.createElement('div');
        qDiv.className = 'mcq-question';
        qDiv.innerHTML = `<span class="q-num">Q${qNum}</span> <span>${escapeHtml(q.q)}</span>`;

        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';

        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        feedbackDiv.id = `feedback-${idx}`;

        q.opts.forEach((optText, optIdx) => {
          const label = document.createElement('label');
          label.className = 'option';
          label.dataset.optIdx = optIdx;

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `q${idx}`;
          radio.value = optIdx;

          const span = document.createElement('span');
          span.textContent = optText;

          label.appendChild(radio);
          label.appendChild(span);

          const saved = answeredState[idx];
          if (saved !== undefined) {
            if (saved === optIdx) {
              radio.checked = true;
              label.classList.add('selected');
              if (optIdx === q.correctIdx) {
                label.classList.add('correct-option');
                card.classList.add('correct-highlight');
                feedbackDiv.textContent = '✓ Correct!';
                feedbackDiv.classList.add('correct');
              } else {
                label.classList.add('wrong-option');
                card.classList.add('wrong-highlight');
                feedbackDiv.textContent = `✗ Incorrect. The correct answer is: ${escapeHtml(q.opts[q.correctIdx])}`;
                feedbackDiv.classList.add('wrong');
                const correctLabel = optsDiv.querySelector(`.option[data-opt-idx="${q.correctIdx}"]`);
                if (correctLabel) correctLabel.classList.add('correct-option');
              }
            }
          }

          radio.addEventListener('change', (e) => {
            handleOptionSelect(idx, optIdx, q, card, optsDiv, feedbackDiv);
          });

          optsDiv.appendChild(label);
        });

        card.appendChild(qDiv);
        card.appendChild(optsDiv);
        card.appendChild(feedbackDiv);
        mcqList.appendChild(card);
      });

      updateAnsweredCount();
    }

    function handleOptionSelect(qIdx, optIdx, question, card, optsDiv, feedbackDiv) {
      const allOptions = optsDiv.querySelectorAll('.option');
      allOptions.forEach(opt => {
        opt.classList.remove('selected', 'correct-option', 'wrong-option');
      });
      card.classList.remove('correct-highlight', 'wrong-highlight');
      feedbackDiv.textContent = '';
      feedbackDiv.className = 'feedback';

      const selectedLabel = optsDiv.querySelector(`.option[data-opt-idx="${optIdx}"]`);
      if (selectedLabel) selectedLabel.classList.add('selected');

      const isCorrect = (optIdx === question.correctIdx);

      if (isCorrect) {
        if (selectedLabel) selectedLabel.classList.add('correct-option');
        card.classList.add('correct-highlight');
        feedbackDiv.textContent = '✓ Correct!';
        feedbackDiv.classList.add('correct');
      } else {
        if (selectedLabel) selectedLabel.classList.add('wrong-option');
        card.classList.add('wrong-highlight');
        const correctLabel = optsDiv.querySelector(`.option[data-opt-idx="${question.correctIdx}"]`);
        if (correctLabel) correctLabel.classList.add('correct-option');
        feedbackDiv.textContent = `✗ Incorrect. The correct answer is: ${escapeHtml(question.opts[question.correctIdx])}`;
        feedbackDiv.classList.add('wrong');
      }

      answeredState[qIdx] = optIdx;
      updateAnsweredCount();
    }

    function updateAnsweredCount() {
      const total = currentQuestions.length;
      const answered = Object.keys(answeredState).length;
      answeredCountSpan.textContent = `${answered} / ${total} answered`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function init() {
      const questions = buildQuestionSet(false, false);
      renderQuiz(questions, true);
    }

    shuffleBtn.addEventListener('click', () => {
      const shuffled = buildQuestionSet(true, true);
      renderQuiz(shuffled, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Dark mode toggle
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      if (document.body.classList.contains('dark')) {
        themeBtn.textContent = '☀️ Light mode';
      } else {
        themeBtn.textContent = '🌙 Dark mode';
      }
    });

    init();
  </script>
</body>
</html>
